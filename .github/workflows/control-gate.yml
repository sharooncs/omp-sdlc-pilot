name: Control gate

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  control-gate:
    name: control-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject candidate control changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          BRANCH_POINT=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          if git diff --no-renames --name-only "$BRANCH_POINT" "$HEAD_SHA" | grep -E '^\.github/|^\.coderabbit\.yaml$'; then
            echo 'Control changes need a separate owner review.' >&2
            exit 1
          fi
